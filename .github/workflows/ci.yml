name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  TOOLCHAIN_REPO: shauninman/union-miyoomini-toolchain
  TOOLCHAIN_REF: cfcae3083679de59d6600d4ba05676c654b6d24e

jobs:
  lint-and-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Proprietary asset guard
        run: |
          chmod +x tools/check-no-proprietary.sh tools/sdl-inventory.sh tools/package.sh \
            tools/check-miyoomini-elf.sh
          ./tools/check-no-proprietary.sh

  host-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build/host -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSCP_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/host -j$(nproc)
      - name: Test
        run: ctest --test-dir build/host --output-on-failure
      - name: Package whitelist
        run: |
          chmod +x tools/package.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq zip
          ./tools/package.sh build/host
      - name: Upload pak artifact
        uses: actions/upload-artifact@v4
        with:
          name: PINBALL-pak-host
          path: dist/PINBALL.pak.zip

  miyoomini-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: project

      - name: Checkout Miyoo Mini toolchain
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TOOLCHAIN_REPO }}
          ref: ${{ env.TOOLCHAIN_REF }}
          path: toolchain

      - name: Build toolchain image
        run: docker build -t miyoomini-toolchain ./toolchain

      - name: Cross-compile, ELF check, package
        run: |
          chmod +x project/tools/package.sh project/tools/check-miyoomini-elf.sh
          docker run --rm \
            -v "$GITHUB_WORKSPACE/project:/root/workspace" \
            miyoomini-toolchain \
            /bin/bash -lc '
              set -euo pipefail
              source /root/setup-env.sh
              cd /root/workspace
              cmake -S . -B build/miyoomini \
                -DCMAKE_TOOLCHAIN_FILE=cmake/miyoomini.toolchain.cmake \
                -DCMAKE_BUILD_TYPE=Release
              cmake --build build/miyoomini -j"$(nproc)"
              SO=""
              for cand in build/miyoomini/spacecadetpinball_libretro.so \
                          build/miyoomini/libspacecadetpinball_libretro.so; do
                if [[ -f "$cand" ]]; then SO="$cand"; break; fi
              done
              if [[ -z "$SO" ]]; then
                echo "ERROR: core .so not found under build/miyoomini" >&2
                exit 1
              fi
              ./tools/check-miyoomini-elf.sh "$SO"
              ./tools/package.sh build/miyoomini
            '

      - name: Upload miyoomini pak artifact
        uses: actions/upload-artifact@v4
        with:
          name: PINBALL-pak-miyoomini
          path: project/dist/PINBALL.pak.zip
