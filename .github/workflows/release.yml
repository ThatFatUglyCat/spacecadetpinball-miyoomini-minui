name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Pin union-miyoomini-toolchain (Dockerfile on debian/eol:buster-slim).
  TOOLCHAIN_REPO: shauninman/union-miyoomini-toolchain
  TOOLCHAIN_REF: cfcae3083679de59d6600d4ba05676c654b6d24e

jobs:
  host-pak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Guards
        run: |
          chmod +x tools/check-no-proprietary.sh tools/package.sh
          ./tools/check-no-proprietary.sh

      - name: Configure & build
        run: |
          cmake -S . -B build/host -DCMAKE_BUILD_TYPE=Release -DSCP_BUILD_TESTS=ON
          cmake --build build/host -j$(nproc)
          ctest --test-dir build/host --output-on-failure

      - name: Package
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zip
          ./tools/package.sh build/host
          cp dist/PINBALL.pak.zip "dist/PINBALL.pak-host-${GITHUB_REF_NAME}.zip"

      - name: Upload host pak
        uses: actions/upload-artifact@v4
        with:
          name: pak-host
          path: dist/PINBALL.pak-host-${{ github.ref_name }}.zip

  miyoomini-pak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: project

      - name: Checkout Miyoo Mini toolchain
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TOOLCHAIN_REPO }}
          ref: ${{ env.TOOLCHAIN_REF }}
          path: toolchain

      - name: Build toolchain image
        run: docker build -t miyoomini-toolchain ./toolchain

      - name: Cross-compile, ELF check, package
        run: |
          chmod +x project/tools/package.sh project/tools/check-miyoomini-elf.sh
          # Rename inside the container: Docker runs as root and creates
          # project/dist owned by root, so a host-side cp into that dir fails.
          docker run --rm \
            -e "GITHUB_REF_NAME=${GITHUB_REF_NAME}" \
            -v "$GITHUB_WORKSPACE/project:/root/workspace" \
            miyoomini-toolchain \
            /bin/bash -lc '
              set -euo pipefail
              # .bashrc is not sourced for non-interactive shells.
              source /root/setup-env.sh
              cd /root/workspace
              cmake -S . -B build/miyoomini \
                -DCMAKE_TOOLCHAIN_FILE=cmake/miyoomini.toolchain.cmake \
                -DCMAKE_BUILD_TYPE=Release
              # CMake 3.13 rejects glued -jN; use --parallel with a separate arg.
              cmake --build build/miyoomini --parallel "$(nproc)"
              SO=""
              for cand in build/miyoomini/spacecadetpinball_libretro.so \
                          build/miyoomini/libspacecadetpinball_libretro.so; do
                if [[ -f "$cand" ]]; then SO="$cand"; break; fi
              done
              if [[ -z "$SO" ]]; then
                echo "ERROR: core .so not found under build/miyoomini" >&2
                exit 1
              fi
              ./tools/check-miyoomini-elf.sh "$SO"
              ./tools/package.sh build/miyoomini
              cp dist/PINBALL.pak.zip \
                "dist/PINBALL.pak-miyoomini-${GITHUB_REF_NAME}.zip"
            '

      - name: Upload miyoomini pak
        uses: actions/upload-artifact@v4
        with:
          name: pak-miyoomini
          path: project/dist/PINBALL.pak-miyoomini-${{ github.ref_name }}.zip

  publish:
    needs: [host-pak, miyoomini-pak]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum PINBALL.pak-host-${GITHUB_REF_NAME}.zip \
                    PINBALL.pak-miyoomini-${GITHUB_REF_NAME}.zip > SHA256SUMS
          cat SHA256SUMS
          ls -la

      - name: Release notes
        run: |
          {
            echo "## SpaceCadetPinball MinUI ${GITHUB_REF_NAME}"
            echo
            echo "### Download which zip?"
            echo
            echo "| Asset | Use on |"
            echo "|---|---|"
            echo "| \`PINBALL.pak-miyoomini-${GITHUB_REF_NAME}.zip\` | **Miyoo Mini / Mini Plus / Mini V4** (MinUI \`Emus/miyoomini/\`) |"
            echo "| \`PINBALL.pak-host-${GITHUB_REF_NAME}.zip\` | Desktop RetroArch (x86_64). **Not** for the handheld — wrong ELF class. |"
            echo
            echo "**No game data included.** Supply your own legitimate \`PINBALL.DAT\` and WAVs."
            echo
            echo "See \`docs/USER_GUIDE.md\` and \`CHANGELOG.md\`."
          } > dist/RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PINBALL.pak-miyoomini-${{ github.ref_name }}.zip
            dist/PINBALL.pak-host-${{ github.ref_name }}.zip
            dist/SHA256SUMS
          body_path: dist/RELEASE_NOTES.md
          draft: false
          generate_release_notes: true
