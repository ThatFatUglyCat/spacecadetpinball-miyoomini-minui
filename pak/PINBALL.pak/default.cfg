# Primary MinUI binds. The core also ORs L2 with Left Flipper, R2 with Right
# Flipper, and B with Plunger (OnionOS-compatible aliases) in input.cpp.
bind Left Flipper = L1
bind Right Flipper = R1
bind Plunger = A
bind Nudge Left = LEFT
bind Nudge Right = RIGHT
bind Nudge Bottom = UP
bind High Scores = DOWN
bind Toggle Sound = X
bind Toggle Music = Y
bind Pause = START
bind New Game = SELECT
